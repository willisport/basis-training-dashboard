name: Login-Anfrage freischalten

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: |
      github.event.label.name == 'genehmigt' &&
      contains(github.event.issue.labels.*.name, 'login-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r sync/requirements.txt

      - name: Nutzer freischalten und pushen (mit Retry bei Konflikt)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: |
          git config user.name "basis-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            (cd sync && python approve_login_from_issue.py)
            git add data/auth-config.json
            if git diff --staged --quiet; then echo "Keine Aenderung noetig"; exit 0; fi
            git commit -m "Login freigeschaltet via Issue #${{ github.event.issue.number }}"
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen, hole neuesten Stand und versuche erneut..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Konnte nach mehreren Versuchen nicht pushen." >&2
          exit 1

      - name: Issue kommentieren und schliessen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "✅ Freigeschaltet! Login mit Benutzername + eigenem Passwort ist jetzt möglich (kann bis zu einer Minute dauern, bis die Seite aktualisiert ist)."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
