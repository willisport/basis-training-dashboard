name: Trainingsdaten synchronisieren

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Garmin-Token-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: sync/.garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Abhaengigkeiten installieren
        run: pip install -r sync/requirements.txt

      - name: Sync ausfuehren
        working-directory: sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          RENPHO_EMAIL: ${{ secrets.RENPHO_EMAIL }}
          RENPHO_PASSWORD: ${{ secrets.RENPHO_PASSWORD }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: python sync.py

      - name: Verschluesselte Daten committen
        run: |
          git config user.name "basis-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/training-data.enc.json
          git diff --staged --quiet || git commit -m "Automatischer Trainingsdaten-Sync"
          git push
