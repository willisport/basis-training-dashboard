name: Login abmelden

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Abzumeldender Benutzername"
        required: true

permissions:
  contents: write

jobs:
  logout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sitzung invalidieren und pushen (mit Retry bei Konflikt)
        env:
          LOGOUT_USERNAME: ${{ github.event.inputs.username }}
        run: |
          git config user.name "basis-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            (cd sync && python bump_session.py)
            git add data/auth-config.json
            if git diff --staged --quiet; then echo "Keine Aenderung noetig"; exit 0; fi
            git commit -m "Login abgemeldet: ${{ github.event.inputs.username }}"
            if git push; then exit 0; fi
            echo "Push fehlgeschlagen, hole neuesten Stand und versuche erneut..."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Konnte nach mehreren Versuchen nicht pushen." >&2
          exit 1
