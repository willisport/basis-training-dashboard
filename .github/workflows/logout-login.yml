name: Login abmelden

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Abzumeldender Benutzername"
        required: true

permissions:
  contents: write

jobs:
  logout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sitzung invalidieren
        working-directory: sync
        env:
          LOGOUT_USERNAME: ${{ github.event.inputs.username }}
        run: python bump_session.py

      - name: Aenderung committen und pushen
        run: |
          git config user.name "basis-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/auth-config.json
          git diff --staged --quiet && echo "Keine Aenderung" || (git commit -m "Login abgemeldet: ${{ github.event.inputs.username }}" && git push)
